<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Email Threat Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0; padding: 40px;
            display: flex; justify-content: center;
        }
        .container {
            background: white; padding: 30px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%; max-width: 600px;
        }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 25px; font-size: 14px; }
        textarea {
            width: 100%; height: 150px; padding: 10px;
            border: 1px solid #bdc3c7; border-radius: 5px;
            font-family: inherit; resize: vertical; margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background: #3498db; color: white;
            border: none; border-radius: 5px; font-size: 16px;
            cursor: pointer; transition: 0.3s;
        }
        button:hover { background: #2980b9; }
        .result-box {
            margin-top: 20px; padding: 15px; border-radius: 5px;
            text-align: center; display: none; font-weight: bold;
        }
        .legit { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .spam { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .phishing { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h1>Enterprise Email Threat Detection</h1>
    <p class="subtitle">AI-Powered Multi-Class Classification (SVM)</p>
    
    <textarea id="emailInput" placeholder="Paste email text or subject/body here to analyze..."></textarea>
    <button onclick="analyzeEmail()" id="btn">Analyze Email</button>

    <div id="resultBox" class="result-box"></div>
</div>

<script>
    async function analyzeEmail() {
        const text = document.getElementById('emailInput').value;
        const resultBox = document.getElementById('resultBox');
        const btn = document.getElementById('btn');
        
        if (!text.trim()) {
            alert("Please paste some email text first.");
            return;
        }

        btn.innerText = "Analyzing...";
        btn.disabled = true;
        resultBox.style.display = "none";

        try {
            const response = await fetch('http://127.0.0.1:5000/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            
            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error);
            }

            // Update UI
            resultBox.style.display = "block";
            resultBox.innerText = `Classification: ${data.prediction.toUpperCase()} (${data.confidence}% confidence)`;
            
            // Reset classes
            resultBox.className = "result-box";
            
            // Apply color based on prediction
            if (data.prediction === "Legitimate") resultBox.classList.add("legit");
            else if (data.prediction === "Spam") resultBox.classList.add("spam");
            else resultBox.classList.add("phishing");

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btn.innerText = "Analyze Email";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
